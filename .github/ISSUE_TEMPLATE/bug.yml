name: Bug
description: Algo no funciona como se esperaba (guía front §11.2)
title: "fix: "
labels: ["tipo:bug"]
body:
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasa
    validations:
      required: true

  - type: textarea
    id: que-deberia-pasar
    attributes:
      label: Qué debería pasar
    validations:
      required: true

  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true

  - type: dropdown
    id: entorno
    attributes:
      label: Entorno
      options:
        - local
        - dev
        - prod
    validations:
      required: true

  - type: dropdown
    id: dispositivo
    attributes:
      label: Dispositivo
      options:
        - escritorio
        - celular
        - ambos
    validations:
      required: true

  - type: textarea
    id: evidencia
    attributes:
      label: Evidencia
      description: Logs, capturas o la URL (nunca el código de acceso ni datos de tarjetas).
